<style>#__pf{--bg:#f7f2e7;--bg2:#ede3cf;--ink:#1c2a4a;--muted:#6d6a5e;--acc:#b23a2e;--acc2:#1c2a4a;--line:rgba(127,127,127,.2);--dark:#1c2a4a;--ondark:#f7f2e7;--card:#f7f2e7;--onacc:#fff;--onacc2:#fff;--r:16px;--rb:0px;--ri:16px;--fh:"Zen Antique", serif;--fb:"Zen Kaku Gothic New", sans-serif;font-family:var(--fb);color:var(--ink);-webkit-font-smoothing:antialiased;}
#__pf *{box-sizing:border-box;}
#__pf h1, #__pf h2, #__pf h3, #__pf h4{font-family:var(--fh);font-weight:700;line-height:1.08;}
#__pf .pu-bg-base{background:var(--bg);}
#__pf .pu-bg-alt{background:var(--bg2);}
#__pf .pu-bg-dark{background:var(--dark);color:var(--ondark);}
#__pf .pu-h1, #__pf .pu-h2, #__pf .pu-h3{margin:0;color:var(--ink);font-family:var(--fh);font-weight:700;text-transform:none;letter-spacing:-0.02em;}
#__pf .pu-h1{font-size:clamp(42px,6vw,104px);line-height:1;}
#__pf .pu-h2{font-size:clamp(32px,4vw,60px);line-height:1.06;}
#__pf .pu-h3{font-size:21px;line-height:1.25;letter-spacing:0;}
#__pf .pu-h1 em, #__pf .pu-h2 em{font-style:italic;color:var(--acc);}
#__pf .pu-eyebrow{margin:0;font-family:var(--fb);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);}
#__pf .pu-lede{margin:0;font-size:18px;line-height:1.65;color:var(--muted);}
#__pf .pu-p{margin:0;font-size:15.5px;line-height:1.7;color:var(--muted);}
#__pf .pu-small{margin:0;font-size:13px;line-height:1.5;color:var(--muted);letter-spacing:.01em;}
#__pf .pu-center{text-align:center;}
#__pf .pu-bg-dark .pu-h1, #__pf .pu-bg-dark .pu-h2, #__pf .pu-bg-dark .pu-h3, #__pf .pu-bg-dark .pu-bigq, #__pf .pu-bg-dark .pu-tname, #__pf .pu-bg-dark .pu-cdnum{color:var(--ondark);}
#__pf .pu-bg-dark .pu-lede, #__pf .pu-bg-dark .pu-p, #__pf .pu-bg-dark .pu-small{color:var(--ondark);opacity:.74;}
#__pf .pu-hbg::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.65));pointer-events:none;}
#__pf .pu-hbg .pu-h1, #__pf .pu-hbg .pu-h2, #__pf .pu-hbg .pu-lede, #__pf .pu-hbg .pu-small, #__pf .pu-hbg .pu-h3{color:#fff;opacity:1;}
#__pf .pu-hbg .pu-eyebrow{color:#fff;opacity:.9;}
#__pf .pu-img img{border-radius:var(--ri);}
#__pf .pu-hbg-img img{border-radius:0;}
#__pf .pu-zoom img{transition:transform 1.4s cubic-bezier(.2,.7,.2,1);}
#__pf .pu-zoom:hover img{transform:scale(1.07);}
#__pf .pu-btn{font-family:var(--fb);font-weight:600;font-size:13.5px;letter-spacing:.02em;text-transform:none;padding:17px 30px;text-decoration:none;line-height:1;gap:10px;cursor:pointer;border:1.5px solid transparent;transition:all .45s cubic-bezier(.2,.7,.2,1);white-space:nowrap;}
#__pf .pu-btn svg{width:14px;height:14px;transition:transform .45s cubic-bezier(.2,.7,.2,1);fill:currentColor;}
#__pf .pu-btn:hover svg{transform:translateX(5px);}
#__pf .pu-btn-pri{color:var(--onacc);background:linear-gradient(var(--acc2),var(--acc2)) no-repeat 0 100%/100% 0%,var(--acc);border-radius:0;}
#__pf .pu-btn-pri:hover{background-size:100% 100%;color:var(--onacc2);transform:translateY(-2px);}
#__pf .pu-btn-sec{color:var(--ink);background:transparent;border-color:currentColor;border-radius:0;}
#__pf .pu-btn-sec:hover{background:var(--ink);color:var(--bg);border-color:var(--ink);}
#__pf .pu-bg-dark .pu-btn-sec, #__pf .pu-hbg .pu-btn-sec{color:#fff;}
#__pf .pu-bg-dark .pu-btn-sec:hover, #__pf .pu-hbg .pu-btn-sec:hover{background:#fff;color:#111;border-color:#fff;}
#__pf .pu-btn-link{padding:0 0 6px;background:none;color:var(--ink);border:0;border-bottom:1.5px solid currentColor;border-radius:0;box-shadow:none;}
#__pf .pu-btn-link:hover{color:var(--acc);}
#__pf .pu-bg-dark .pu-btn-link{color:var(--ondark);}
#__pf .pu-pcard{background:transparent; border-radius:var(--r);transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;}
#__pf .pu-pcard:hover{transform:translateY(-6px);}
#__pf .pu-pmedia{border-radius:calc(var(--r) - 2px);overflow:hidden;background:var(--bg2);}
#__pf .pu-pmedia img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1);}
#__pf .pu-pcard:hover .pu-pmedia img{transform:scale(1.06);}
#__pf .pu-ptitle, #__pf .pu-ptitle a{margin:0;font-family:var(--fpt,var(--fb));font-size:16px;font-weight:600;line-height:1.35;color:var(--ink);text-decoration:none;letter-spacing:0;text-transform:none;}
#__pf .pu-pprice{font-size:15px;}
#__pf .pu-pp-now{color:var(--ink);font-weight:700;}
#__pf .pu-pp-was{color:var(--muted);text-decoration:line-through;font-size:.88em;}
#__pf .pu-patc{font-family:var(--fb);font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:13px 16px;background:var(--ink);color:var(--bg);border:0;cursor:pointer;border-radius:var(--rb);transition:all .35s;}
#__pf .pu-patc:hover{background:var(--acc);color:var(--onacc);}
#__pf .pu-patc svg{width:12px;height:12px;fill:currentColor;}
#__pf .pu-pbadge{background:var(--acc);color:var(--onacc);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:var(--rb);}
#__pf .pu-bg-dark .pu-ptitle, #__pf .pu-bg-dark .pu-ptitle a, #__pf .pu-bg-dark .pu-pp-now{color:var(--ondark);}
#__pf .pu-uspt{margin:0;font-weight:700;font-size:14.5px;color:var(--ink);}
#__pf .pu-bg-dark .pu-uspt{color:var(--ondark);}
#__pf .pu-pull, #__pf .pu-bigq{margin:0;font-family:var(--fh);font-size:clamp(24px,2.6vw,34px);line-height:1.35;color:var(--ink);font-weight:700;}
#__pf .pu-bigq{font-size:clamp(28px,3.6vw,50px);line-height:1.2;}
#__pf .pu-pull{padding-left:24px;border-left:3px solid var(--acc);}
#__pf .pu-frame-tilt{transform:rotate(-2.5deg);}

#__pf .pu-tcard{background:var(--card);padding:32px 30px;border-radius:var(--r);border:1px solid var(--line);}
#__pf .pu-tq{color:var(--ink);font-size:16px;}
#__pf .pu-tname{margin:0;font-weight:700;font-size:14px;color:var(--ink);}
